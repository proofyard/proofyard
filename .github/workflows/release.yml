name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    if: github.repository == 'proofyard/proofyard'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # npm Trusted Publishing (OIDC): no token; provenance is attached automatically.
  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Publish
        run: npm publish --access public

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
