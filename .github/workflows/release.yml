name: release

# release-please keeps a release PR (version bump + CHANGELOG) up to date from
# Conventional Commits on main. Merging it tags the release, and then the
# package is staged on npm for approval.
on:
  push:
    branches: [main]

permissions: {}

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    if: github.repository == 'proofyard/proofyard'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release PR / GitHub Release
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  ci:
    name: CI
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  # npm Trusted Publishing (OIDC): no token; provenance is attached automatically.
  # Staged: the version goes live only after a maintainer approves it on npm (2FA).
  publish:
    name: Stage on npm
    needs: [release-please, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the tag matches package.json
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Stage the publish
        run: npm stage publish . --access public
