version: 2

# Weekly, one pull request per ecosystem. A release must be a week old first,
# so a compromised one is likelier to be pulled before it reaches us.
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Proofyard uses Next.js's internals and supports 16.4 patches only
    # (peerDependencies, checked by src/next/preload.ts): a new minor is a code
    # change, not a bump. React comes from Next.js.
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: '@next/*'
        update-types: [version-update:semver-major, version-update:semver-minor]
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: react-server-dom-turbopack
    groups:
      # Its own pull request, so CI on a new Next.js patch doesn't hold back the rest.
      next:
        patterns: [next, '@next/*']
      bun:
        patterns: ['*']
    labels: [dependencies]

  # Also the SHAs the workflows pin.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    labels: [dependencies]
